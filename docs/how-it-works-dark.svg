<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" width="1040" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">How WarpSense reaches a verdict</title><path d="M30 62H590" stroke="#6e7681" stroke-width="2" fill="none"/><path d="M590 62H850" stroke="#6e7681" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" fill="none"/><path d="M205 62V156q0 16 16 16H834q16 0 16 -16V76" stroke="#ff7b62" stroke-width="6" fill="none"/><path d="M839 82L850 65L861 82Z" fill="#ff7b62"/><circle cx="30" cy="62" r="5" fill="#6e7681"/><circle cx="395" cy="62" r="5" fill="#6e7681"/><circle cx="590" cy="62" r="5" fill="#6e7681"/><circle cx="205" cy="62" r="7" fill="#ff7b62"/><text x="30" y="40" font-size="17" font-weight="600" fill="#e6edf3">Sensors</text><text x="30" y="92" font-size="14" fill="#9198a1">4 channels,</text><text x="30" y="112" font-size="14" fill="#9198a1">1500 frames a session</text><text x="205" y="40" font-size="17" font-weight="600" fill="#e6edf3">Features</text><text x="221" y="92" font-size="14" fill="#9198a1">11 measures of heat,</text><text x="221" y="112" font-size="14" fill="#9198a1">angle and arc stability</text><text x="395" y="40" font-size="17" font-weight="600" fill="#e6edf3">Classifier</text><text x="395" y="92" font-size="14" fill="#9198a1">Good, marginal</text><text x="395" y="112" font-size="14" fill="#9198a1">or defective</text><text x="590" y="40" font-size="17" font-weight="600" fill="#e6edf3">Three AI agents</text><text x="590" y="92" font-size="14" fill="#9198a1">Thermal, geometry, process,</text><text x="590" y="112" font-size="14" fill="#9198a1">citing AWS D1.1 and ISO 5817</text><text x="850" y="40" font-size="17" font-weight="600" fill="#e6edf3">Quality report</text><text x="868" y="92" font-size="14" fill="#9198a1">Pass, conditional</text><text x="868" y="112" font-size="14" fill="#9198a1">or rework</text><text x="235" y="156" font-size="17" font-weight="600" fill="#ff7b62">Fixed thresholds, no model involved</text><text x="235" y="204" font-size="15" fill="#e6edf3">A lack-of-fusion or lack-of-penetration reading in the risk band makes the report say rework,</text><text x="235" y="226" font-size="15" fill="#e6edf3">whatever the agents concluded. If an agent fails, its verdict comes from these thresholds too.</text></svg>